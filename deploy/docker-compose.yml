# Development only. Not a production deployment reference.
name: schemasentry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schemasentry
      POSTGRES_PASSWORD: schemasentry
      POSTGRES_DB: schemasentry
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemasentry"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The CLI is run on demand, not as a service:
  #   docker compose run --rm cli compare --baseline ./snapshots/main.json --database $DATABASE_URL
  cli:
    build: .
    profiles: ["cli"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://schemasentry:schemasentry@postgres:5432/schemasentry
    volumes:
      - .:/work
    working_dir: /work
