name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"
          pip install "setuptools>=75" wheel

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Public documentation and schemas
        run: make VENV_PY=python check-docs

      - name: Package build
        run: make VENV_PY=python build

      - name: Test
        run: pytest --cov=src --cov-report=term-missing

  integration:
    name: Integration (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["13", "15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: schemasentry
          POSTGRES_PASSWORD: schemasentry
          POSTGRES_DB: schemasentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schemasentry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"

      - name: Integration tests
        env:
          SCHEMASENTRY_TEST_DATABASE_URL: postgresql://schemasentry:schemasentry@localhost:5432/schemasentry
        run: pytest tests/integration -q

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --strict --disable-pip --require-hashes -r requirements.lock
